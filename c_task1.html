<!DOCTYPE html>
<html>
<style>
    /* Table Styling */
table {
    border-collapse: separate;
    border-spacing: 5px;
    width: 80%;
    margin: auto;
    background-color: lightblue;
    border: 2px solid black;
    border-radius: 10px;
    text-align: left;
  }
  
  th, td {
    padding: 10px;
    border: 1px solid black;
    border-radius: 10px;
  }
  
  th {
    font-weight: bold;
  }
  
  /* Boxes Styling */
  .box-container {
    display: grid;
    grid-template-columns: repeat(3, 100px);
    gap: 20px;
    justify-content: center;
    margin-top: 40px;
  }
  
  .box {
    width: 100px;
    height: 60px;
    border: 2px solid rgb(27, 220, 69);
  }
  
  .round {
    border-radius: 10px;
  }
  
  .rounded {
    border-radius: 25px;
  }
  
  .oval {
    border-radius: 50%;
  }
  
</style>

<head>
  <title>Styled Table and Boxes</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Table -->
<table>
  <tr>
    <th>Firstname</th>
    <th>Lastname</th>
    <th>Age</th>
  </tr>
  <tr>
    <td>Jill</td>
    <td>Smith</td>
    <td>50</td>
  </tr>
  <tr>
    <td>Eve</td>
    <td>Jackson</td>
    <td>94</td>
  </tr>
  <tr>
    <td>John</td>
    <td>Doe</td>
    <td>80</td>
  </tr>
</table>

<!-- Box Shapes -->
<div class="box-container">
  <div class="box"></div>
  <div class="box round"></div>
  <div class="box rounded"></div>
  
  <div class="box"></div>
  <div class="box"></div>
  <div class="box rounded"></div>
  
  <div class="box oval"></div>
  <div class="box"></div>
  <div class="box rounded"></div>
</div>

</body>
</html>
