<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Form Validation</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background-color: #f5f5f5;
    }

    .form-container {
      background: rgb(196, 194, 194);
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.1);
    }

    .form-icon {
      position: absolute;
      top: 50%;
      left: 10px;
      transform: translateY(-50%);
      color: #414040;
    }

    .form-control-icon {
      padding-left: 2.5rem;
    }

    .invalid-feedback {
      display: block;
    }

    .form-control.is-invalid {
      padding-right: 2.5rem;
    }

    .form-control-icon + .is-invalid ~ .bi-x-circle {
      display: inline;
    }

    .bi-x-circle {
      position: absolute;
      top: 50%;
      right: 10px;
      transform: translateY(-50%);
      color: rgb(147, 30, 30);
      display: none;
    }
  </style>
</head>
<body>

<div class="container mt-5">
  <div class="form-container">
    <form class="needs-validation" novalidate>

      <!-- First Name -->
      <div class="mb-3 position-relative">
        <label class="form-label">First Name</label>
        <i class="bi bi-person form-icon"></i>
        <input type="text" class="form-control form-control-icon" placeholder="First Name" required>
        <i class="bi bi-x-circle"></i>
        <div class="invalid-feedback">Please supply your first name</div>
      </div>

      <!-- Last Name -->
      <div class="mb-3 position-relative">
        <label class="form-label">Last Name</label>
        <i class="bi bi-person form-icon"></i>
        <input type="text" class="form-control form-control-icon" placeholder="Last Name" required>
        <i class="bi bi-x-circle"></i>
        <div class="invalid-feedback">Please supply your last name</div>
      </div>

      <!-- E-Mail -->
      <div class="mb-3 position-relative">
        <label class="form-label">E-Mail</label>
        <i class="bi bi-envelope form-icon"></i>
        <input type="email" class="form-control form-control-icon" placeholder="E-Mail Address" required>
        <i class="bi bi-x-circle"></i>
        <div class="invalid-feedback">Please supply your email address</div>
      </div>

      <!-- Phone -->
      <div class="mb-3 position-relative">
        <label class="form-label">Phone #</label>
        <i class="bi bi-telephone form-icon"></i>
        <input type="tel" class="form-control form-control-icon" placeholder="(845)555-1212" required>
        <i class="bi bi-x-circle"></i>
        <div class="invalid-feedback">Please supply your phone number</div>
      </div>

      <!-- Address -->
      <div class="mb-3 position-relative">
        <label class="form-label">Address</label>
        <i class="bi bi-house-door form-icon"></i>
        <input type="text" class="form-control form-control-icon" placeholder="Address" required>
        <i class="bi bi-x-circle"></i>
        <div class="invalid-feedback">Please supply your street address</div>
      </div>

      <!-- City -->
      <div class="mb-3 position-relative">
        <label class="form-label">City</label>
        <i class="bi bi-house-door form-icon"></i>
        <input type="text" class="form-control form-control-icon" placeholder="city" required>
        <i class="bi bi-x-circle"></i>
        <div class="invalid-feedback">Please supply your city</div>
      </div>

      <!-- State -->
      <div class="mb-3">
        <label class="form-label">State</label>
        <select class="form-select" required>
          <option value="">Please select your state</option>
          <option>State 1</option>
          <option>State 2</option>
        </select>
        <div class="invalid-feedback">Please select your state</div>
      </div>

      <!-- Hosting -->
      <div class="mb-3">
        <label class="form-label">Do you have hosting?</label><br>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="hosting" required>
          <label class="form-check-label">Yes</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="hosting">
          <label class="form-check-label">No</label>
        </div>
        <div class="invalid-feedback d-block">Please select an option</div>
      </div>

      <!-- Project Description -->
      <div class="mb-3 position-relative">
        <label class="form-label">Project Description</label>
        <textarea class="form-control" rows="3" placeholder="Project Description" required></textarea>
        <div class="invalid-feedback">Please provide a project description</div>
      </div>

      <!-- Submit -->
      <div class="text-end">
        <button type="submit" class="btn btn-warning">
          Send <i class="bi bi-send-fill"></i>
        </button>
      </div>

    </form>
  </div>
</div>

<!-- Bootstrap JS and Validation Script -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // Custom Bootstrap validation
  (() => {
    'use strict';
    const forms = document.querySelectorAll('.needs-validation');

    Array.from(forms).forEach(form => {
      form.addEventListener('submit', event => {
        const inputs = form.querySelectorAll('input, textarea, select');
        inputs.forEach(input => {
          const xIcon = input.parentElement.querySelector('.bi-x-circle');
          if (!input.checkValidity()) {
            xIcon?.classList.remove('d-none');
            xIcon?.classList.add('d-inline');
          } else {
            xIcon?.classList.add('d-none');
          }
        });

        if (!form.checkValidity()) {
          event.preventDefault();
          event.stopPropagation();
        }

        form.classList.add('was-validated');
      }, false);
    });
  })();
</script>
</body>
</html>
