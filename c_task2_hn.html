<!DOCTYPE html>
<html>
<style>
    body {
        font-family: Arial, sans-serif;
      }
      
      .nav {
        border: 1px solid black;
        width: fit-content;
      }
      
      .nav ul {
        margin: 0;
        padding: 0;
        list-style-type: none;
        display: flex;
        background-color: #d3d3d3; /* light gray */
      }
      
      .nav li {
        border-right: 1px solid blue;
      }
      
      .nav li:last-child {
        border-right: none;
      }
      
      .nav li a {
        display: block;
        padding: 10px 20px;
        text-decoration: none;
        color: blue;
      }
      
      .nav li.active a {
        background-color: #555;
        color: white;
        font-weight: bold;
      }
      
</style>

<head>
  <title>Horizontal Navigation Bar</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="nav">
  <ul>
    <li class="active"><a href="#">Home</a></li>
    <li><a href="#">Java</a></li>
    <li><a href="#">HTML</a></li>
    <li><a href="#">CSS</a></li>
  </ul>
</div>

</body>
</html>
